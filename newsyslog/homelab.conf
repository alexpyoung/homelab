# Log rotation for the homelab. init.sh copies this to /etc/newsyslog.d/homelab.conf with @USER@ filled in
# (newsyslog runs as root, so it gets a root-owned copy, not a link). Re-run init.sh after editing.
# Rotates at 10 MB, keeps 3.
#
# launchd jobs: there is no signal to make an app reopen its stdout/stderr, so it keeps writing to the
# rotated file until it restarts. N skips the signal, and no compression keeps those writes.
# nginx (Homebrew's default access/error logs): SIGUSR1 (30) reopens its logs, so these are compressed.
#
# logfilename                     owner:group    mode count size when flags pid_file                         signal
/usr/local/var/log/homelab.*.log  @USER@:staff   644  3     10240 *    GN
/opt/homebrew/var/log/nginx/*.log @USER@:staff   644  3     10240 *    GJ    /opt/homebrew/var/run/nginx.pid  30
