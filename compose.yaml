name: homelab

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
    ports:
      - 8191:8191
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: lab.alexyoung.io,localhost:3000
    env_file:
      - path: .env
        required: false
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./homepage/config:/app/config
    restart: unless-stopped
