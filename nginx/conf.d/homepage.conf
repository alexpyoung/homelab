server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lab.alexyoung.io;

    location / {
        proxy_pass http://127.0.0.1:3000;  # Homepage binds IPv4 only; "localhost" tries [::1] first
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
