server {
    listen 443 ssl;
    server_name plex.lab;

    ssl_certificate /usr/local/etc/nginx/certs/local.crt;
    ssl_certificate_key /usr/local/etc/nginx/certs/local.key;

    return 301 http://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name plex.lab;

    location / {
        proxy_pass http://localhost:32400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name watch.alexyoung.io;

    location / {
        proxy_pass http://localhost:32400;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
