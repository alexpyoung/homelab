events {
    worker_connections  1024;
}

http {
    # One wildcard cert for lab.alexyoung.io + *.lab.alexyoung.io, issued and renewed by
    # launchctl/com.homelab.lego.plist. Inherited by every `listen 443 ssl` vhost.
    ssl_certificate     /usr/local/var/lego/certificates/lab.alexyoung.io.crt;
    ssl_certificate_key /usr/local/var/lego/certificates/lab.alexyoung.io.key;

    # Unknown names and bare IPs: close the connection (no TLS handshake on 443).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name lab.alexyoung.io *.lab.alexyoung.io;
        return 301 https://$host$request_uri;
    }

    include /usr/local/etc/nginx/conf.d/*.conf;
}
