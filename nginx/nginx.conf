events {
    worker_connections  1024;
}

http {
    # One wildcard cert for lab.alexyoung.io + *.lab.alexyoung.io, issued and renewed by
    # launchctl/com.homelab.lego.plist. Inherited by every `listen 443 ssl` vhost.
    ssl_certificate     /usr/local/var/lego/certificates/lab.alexyoung.io.crt;
    ssl_certificate_key /usr/local/var/lego/certificates/lab.alexyoung.io.key;

    # Proxy settings shared by every vhost (inherited because no location sets its own).
    # HTTP/1.1 + Upgrade/Connection let WebSockets through (*arr SignalR, Plex notifications).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    # The *arr apps honour X-Forwarded-For and don't count tailnet (100.x) clients as local,
    # so "Authentication: Disabled for Local Addresses" only works if they see nginx (127.0.0.1).
    # An empty value makes nginx omit the header.
    map $host $forwarded_for {
        ~^(radarr|sonarr|prowlarr)\.  "";
        default                       $proxy_add_x_forwarded_for;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Unknown names and bare IPs: close the connection (no TLS handshake on 443).
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name lab.alexyoung.io *.lab.alexyoung.io;
        return 301 https://$host$request_uri;
    }

    include /usr/local/etc/nginx/conf.d/*.conf;
}
